<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: white;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid white;
            margin-bottom: 15px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        p { margin-bottom: 30px; opacity: 0.8; }
        .links a {
            display: block;
            background-color: white;
            color: #333;
            text-decoration: none;
            margin: 10px 0;
            padding: 15px;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        .links a:hover {
            transform: scale(1.05);
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <img src="https://via.placeholder.com/100" alt="Profile" class="profile-img">
        
        <h1>@3amnewsstation</h1>
        <p></p>

        <div class="links">
            <a href="https://3amnewsstation.com" target="_blank">Website 1</a>
            <a href="https://3amnewsstation.my.id" target="_blank">Website 2</a>
            <a href="https://3amnewsstation.cc.cd" target="_blank">Website 3</a>
            
        </div>
    </div>

</body>
</html>
